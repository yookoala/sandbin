<svg xmlns="http://www.w3.org/2000/svg" viewBox="284 224 431 656" width="100%" height="100%">
  <defs>
    <!-- =================================================================== -->
    <!-- COLOR PALETTE DEFINITIONS                                           -->
    <!-- Strictly 2 colors: Vibrant Royal Purple (#4E1680) & Sand (#EA9B25)  -->
    <!--                                                                     -->
    <!-- TYPOGRAPHY ATTRIBUTION & LICENSE                                    -->
    <!-- The "Sandbin" wordmark paths are converted to vector outlines from  -->
    <!-- the "Poetsen One" typeface designed by Rodrigo Fuenzalida.          -->
    <!-- Google Fonts URL: https://fonts.google.com/specimen/Poetsen+One     -->
    <!-- License: SIL Open Font License, Version 1.1 (OFL-1.1)               -->
    <!-- License URL: https://openfontlicense.org                            -->
    <!-- =================================================================== -->
    <style>
      .brand-purple { fill: #4E1680; }
      .brand-amber { fill: #EA9B25; }
    </style>

    <!-- =================================================================== -->
    <!-- CLIP PATH: Bucket Body Trapezoid (for the horizontal amber stripe)  -->
    <!-- =================================================================== -->
    <clipPath id="bucket-body-clip">
      <path d="M 338 500 
               H 675 
               L 643 746 
               A 30 30 0 0 1 613 774 
               H 400 
               A 30 30 0 0 1 370 746 
               Z" />
    </clipPath>

    <!-- =================================================================== -->
    <!-- MASK 1: Browser Window Knockouts                                    -->
    <!-- Cuts out the screen interior, 3 window dots, sand gap & shovel gap  -->
    <!-- =================================================================== -->
    <mask id="browser-window-mask">
      <!-- Everything white is visible -->
      <rect width="1000" height="1000" fill="white" />

      <!-- 3 Top-left window control dots (negative space) -->
      <circle cx="384" cy="247" r="8.5" fill="black" />
      <circle cx="412" cy="247" r="8.5" fill="black" />
      <circle cx="440" cy="247" r="8.5" fill="black" />

      <!-- Inner browser viewport cutout (negative space) -->
      <rect x="375" y="269" width="220" height="170" fill="black" />

      <!-- Negative-space buffer above the sand mound -->
      <path d="M 325 416 C 390 355, 624 355, 690 416 L 690 460 L 325 460 Z" fill="black" />

      <!-- Negative-space buffer around the tilted shovel blade -->
      <g transform="translate(630, 362) rotate(35.6)">
        <rect x="-54" y="-18" width="108" height="100" rx="34" fill="black" />
      </g>
    </mask>

    <!-- =================================================================== -->
    <!-- MASK 2: Browser Inner UI Content Knockouts                          -->
    <!-- Clips the bottom of the amber UI rectangle smoothly above the sand  -->
    <!-- =================================================================== -->
    <mask id="browser-content-mask">
      <rect width="1000" height="1000" fill="white" />
      <!-- Smooth negative-space arc above the sand mound -->
      <path d="M 325 412 C 390 351, 624 351, 690 412 L 690 460 L 325 460 Z" fill="black" />
    </mask>

    <!-- =================================================================== -->
    <!-- MASK 3: Shovel Knockouts                                            -->
    <!-- Cuts out the D-handle grip aperture and clips base below the sand   -->
    <!-- =================================================================== -->
    <mask id="shovel-mask">
      <rect width="1000" height="1000" fill="white" />
      <!-- D-shaped handle opening -->
      <g transform="translate(630, 362) rotate(35.6)">
        <path d="M -18 -85 
                 H 18 
                 C 18 -70, 10 -61, 0 -61 
                 C -10 -61, -18 -70, -18 -85 Z" fill="black" />
      </g>
      <!-- Clean cutoff below the sand base line -->
      <rect x="500" y="432" width="300" height="200" fill="black" />
    </mask>

    <!-- =================================================================== -->
    <!-- MASK 4: Bucket Body & Stripe Handle Channel Knockout                -->
    <!-- Cuts the negative-space channel around the handle & pivot boss      -->
    <!-- =================================================================== -->
    <mask id="bucket-channel-mask">
      <rect width="1000" height="1000" fill="white" />
      <!-- Negative-space C-ring around pivot (625, 508) and outer handle channel -->
      <!-- Returns through the interior of the handle so the top edge overlaps cleanly -->
      <path d="M 602 533 
               C 594 522, 592 515, 592 508 
               A 33 33 0 1 1 654 524 
               C 578 674, 438 762, 348 714 
               L 358 684 
               C 435 724, 554 648, 614 525 
               L 602 533 Z" fill="black" />
    </mask>
  </defs>

  <!-- ===================================================================== -->
  <!-- 1. BROWSER PREVIEW WINDOW (Top Center-Left)                           -->
  <!-- ===================================================================== -->
  <g id="browser-window">
    <!-- Outer Purple Window Frame -->
    <rect class="brand-purple" 
          x="357" y="225" width="255" height="210" rx="22" 
          mask="url(#browser-window-mask)" />

    <!-- Inner Golden-Amber UI Preview Elements -->
    <g class="brand-amber" mask="url(#browser-content-mask)">
      <!-- Left UI preview block -->
      <rect x="395" y="291" width="74" height="110" rx="2" />
      <!-- Right top UI bar -->
      <rect x="487" y="291" width="89" height="18" rx="2" />
      <!-- Right bottom UI bar -->
      <rect x="487" y="328" width="61" height="18" rx="2" />
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- 2. TILTED SAND SHOVEL / SPADE (Top Right)                             -->
  <!-- ===================================================================== -->
  <g id="sand-shovel" mask="url(#shovel-mask)">
    <g class="brand-purple" transform="translate(630, 362) rotate(35.6)">
      <!-- D-Handle and Shaft -->
      <path d="M -35 -95 
               C -36 -70, -24 -54, -11 -48 
               L -11 10 
               L 11 10 
               L 11 -48 
               C 24 -54, 36 -70, 35 -95 
               C 35 -99, 32 -101, 28 -101 
               L -28 -101 
               C -32 -101, -35 -99, -35 -95 Z" />
      <!-- Rounded Spade Blade -->
      <rect x="-38" y="-2" width="76" height="82" rx="18" />
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- 3. GOLDEN SAND MOUND (Rests above the bucket rim, overlaps shovel)    -->
  <!-- ===================================================================== -->
  <path id="sand-mound" 
        class="brand-amber" 
        d="M 340 432 
           C 395 371, 619 371, 674 432 
           Z" />

  <!-- ===================================================================== -->
  <!-- 4. BUCKET BODY & HORIZONTAL STRIPE (Masked by Handle Channel)         -->
  <!-- ===================================================================== -->
  <g id="bucket-body" mask="url(#bucket-channel-mask)">
    <!-- Main Tapered Purple Bucket Body -->
    <path class="brand-purple" 
          d="M 338 500 
             H 675 
             L 643 746 
             A 30 30 0 0 1 613 774 
             H 400 
             A 30 30 0 0 1 370 746 
             Z" />

    <!-- Horizontal Golden-Amber Stripe (Clipped to Bucket Trapezoid) -->
    <rect class="brand-amber" 
          x="330" y="563" width="360" height="61" 
          clip-path="url(#bucket-body-clip)" />

    <!-- Upper Bucket Rim -->
    <path class="brand-purple" 
          d="M 328 447 
             H 682 
             A 20 20 0 0 1 702 467 
             V 484 
             A 18 18 0 0 1 684 502 
             H 327 
             Z" />
  </g>

  <!-- ===================================================================== -->
  <!-- 5. CURVED BUCKET HANDLE & PIVOT BOSS                                  -->
  <!-- ===================================================================== -->
  <path id="bucket-handle" 
        class="brand-purple" 
        d="M 345 447 
           L 330 447 
           C 317 447, 312 454, 308 466 
           C 272 550, 272 650, 355 696 
           C 435 740, 565 655, 637 517 
           A 15 15 0 1 0 611 502 
           C 607 512, 605 524, 602 533 
           C 542 638, 435 705, 366 668 
           C 302 632, 303 552, 327 502 
           L 345 502 
           Z" />

  <!-- ===================================================================== -->
  <!-- 6. BRAND WORDMARK ("Sandbin" Outlined from Poetsen One)               -->
  <!-- Font: Poetsen One by Rodrigo Fuenzalida                               -->
  <!-- URL: https://fonts.google.com/specimen/Poetsen+One                    -->
  <!-- License: SIL Open Font License v1.1 (OFL-1.1)                         -->
  <!-- ===================================================================== -->
  <g id="brand-wordmark" class="brand-purple" fill-rule="evenodd" transform="translate(-4, 0)">
    <!-- 'S' -->
    <path d="M 353 812
             C 356 807, 355 803, 350 801
             C 344 798, 336 796, 328 796
             C 312 796, 303 805, 303 819
             C 303 833, 313 840, 326 844
             C 335 847, 339 850, 339 856
             C 339 861, 334 863, 327 863
             C 320 863, 313 860, 309 858
             C 305 856, 302 858, 300 863
             L 299 866
             C 298 870, 299 873, 304 875
             C 310 877, 319 879, 328 879
             C 346 879, 358 869, 358 854
             C 358 840, 348 833, 334 829
             C 325 826, 321 823, 321 818
             C 321 813, 325 811, 331 811
             C 337 811, 342 813, 346 815
             C 349 817, 352 815, 353 812 Z" />

    <!-- 'a' -->
    <path d="M 418 839
             C 418 822, 408 815, 391 815
             C 381 815, 372 817, 368 820
             C 365 822, 365 825, 367 829
             L 368 831
             C 370 834, 373 835, 377 833
             C 381 831, 385 830, 390 830
             C 397 830, 400 833, 400 839
             V 841
             H 390
             C 372 841, 363 848, 363 861
             C 363 872, 371 879, 383 879
             C 391 879, 397 876, 401 871
             C 402 875, 404 877, 409 877
             H 414
             C 417 877, 418 875, 418 871
             Z
             M 400 852
             V 859
             C 400 863, 395 866, 389 866
             C 383 866, 380 863, 380 859
             C 380 854, 384 852, 392 852
             Z" />

    <!-- 'n' -->
    <path d="M 427 821
             V 872
             C 427 875, 429 877, 432 877
             H 441
             C 444 877, 446 875, 446 872
             V 837
             C 446 833, 450 831, 455 831
             C 460 831, 463 834, 463 840
             V 872
             C 463 875, 465 877, 468 877
             H 477
             C 480 877, 482 875, 482 872
             V 837
             C 482 822, 474 815, 461 815
             C 453 815, 448 818, 444 823
             C 443 818, 441 816, 437 816
             H 432
             C 429 816, 427 818, 427 821 Z" />

    <!-- 'd' -->
    <path d="M 528 799
             V 820
             C 524 817, 519 815, 512 815
             C 498 815, 489 827, 489 847
             C 489 867, 498 879, 512 879
             C 519 879, 525 876, 529 871
             C 530 875, 532 877, 536 877
             H 542
             C 545 877, 547 875, 547 872
             V 799
             C 547 796, 545 794, 542 794
             H 533
             C 530 794, 528 796, 528 799 Z
             M 528 835
             V 859
             C 525 862, 522 864, 518 864
             C 511 864, 508 858, 508 847
             C 508 836, 511 830, 518 830
             C 522 830, 525 832, 528 835 Z" />

    <!-- 'b' -->
    <path d="M 556 799
             V 872
             C 556 875, 558 877, 561 877
             H 567
             C 571 877, 573 875, 574 871
             C 578 876, 584 879, 591 879
             C 605 879, 614 867, 614 847
             C 614 827, 605 815, 591 815
             C 584 815, 579 817, 575 820
             V 799
             C 575 796, 573 794, 570 794
             H 561
             C 558 794, 556 796, 556 799 Z
             M 575 859
             V 835
             C 578 832, 581 830, 585 830
             C 592 830, 595 836, 595 847
             C 595 858, 592 864, 585 864
             C 581 864, 578 862, 575 859 Z" />

    <!-- 'i' -->
    <path d="M 632 793
             C 625 793, 621 796, 621 802
             C 621 808, 625 811, 632 811
             C 639 811, 643 808, 643 802
             C 643 796, 639 793, 632 793 Z
             M 623 821
             V 872
             C 623 875, 625 877, 628 877
             H 637
             C 640 877, 642 875, 642 872
             V 821
             C 642 818, 640 816, 637 816
             H 628
             C 625 816, 623 818, 623 821 Z" />

    <!-- 'n' -->
    <path d="M 651 821
             V 872
             C 651 875, 653 877, 656 877
             H 665
             C 668 877, 670 875, 670 872
             V 837
             C 670 833, 674 831, 679 831
             C 684 831, 687 834, 687 840
             V 872
             C 687 875, 689 877, 692 877
             H 701
             C 704 877, 706 875, 706 872
             V 837
             C 706 822, 698 815, 685 815
             C 677 815, 672 818, 668 823
             C 667 818, 665 816, 661 816
             H 656
             C 653 816, 651 818, 651 821 Z" />
  </g>
</svg>